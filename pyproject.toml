[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-layer-langgraph"
version = "0.1.0"
description = "Persistent memory checkpoint saver for LangGraph agents, powered by Synapse Layer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Ismael Marchi", email = "founder.synapselayer@proton.me" }
]
keywords = [
    "langgraph",
    "agent-memory",
    "checkpoint",
    "persistent-memory",
    "synapse-layer",
    "mcp",
    "cross-session",
    "state-continuity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "synapse-layer>=2.4.6",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://synapselayer.org"
Repository = "https://github.com/SynapseLayer/synapse-layer-langgraph"
"Core SDK" = "https://github.com/SynapseLayer/synapse-layer"

[tool.setuptools.packages.find]
include = ["synapse_langgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
